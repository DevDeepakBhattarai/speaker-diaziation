[project]
name = "speaker-diaziation"
version = "0.1.0"
description = "Switch between separate or split-screen speaker views using audio diarization."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gradio>=5.0",
    "huggingface-hub>=0.28.1,<1",
    "pyannote.audio==4.0.7",
    "python-dotenv>=1.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
]

[project.scripts]
speaker-diarize-switch = "main:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
